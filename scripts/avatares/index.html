<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Retratos das peças</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1c120a;
      }
      #folha {
        display: grid;
        grid-template-columns: repeat(6, 160px);
        gap: 12px;
      }
      #folha img {
        width: 160px;
        height: 160px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="folha"></div>
    <script type="module" src="./retratos.js"></script>
  </body>
</html>
