# Os testes a cada envio. Em `main`, quem chama este arquivo é o deploy.yml: o site só é publicado se tudo passar.
# Nos outros ramos e nos pedidos de mudança (pull requests), roda sozinho.
name: Testes

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site (lint, tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  servidor:
    name: Servidor e partida no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - name: Tipos do servidor
        run: npx tsc --noEmit
        working-directory: worker
      # o simulador da Cloudflare, com um segredo aleatório só deste teste (nada a ver com o da produção)
      - name: Simulador do servidor
        working-directory: worker
        run: |
          printf 'PIMENTA=%s\nORIGENS=http://127.0.0.1:5184\nLIMITE_CONTAS=100000\nACELERAR_RELOGIO=30\n' "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler d1 migrations apply xadrez-caotico --local
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
      - name: Site em modo de desenvolvimento
        run: nohup npm run dev > vite.log 2>&1 &
      - name: Esperar os dois no ar
        run: |
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8787/ && curl -s -o /dev/null http://127.0.0.1:5184/xadrez-caotico/; then exit 0; fi
            sleep 2
          done
          echo "não subiram a tempo"; exit 1
      - name: Testes do servidor
        run: node testes/testar-servidor.mjs
      - name: Navegador para os testes da tela
        run: npx playwright install --with-deps chromium
      - name: Blitz, relógio e recompensas
        run: node testes/testar-blitz.mjs
      - name: Registro de erros
        run: node testes/testar-registro-de-erros.mjs
      - name: Passeio, privacidade e volumes
        run: node testes/testar-passeio-e-configuracoes.mjs
      - name: Adversário automático, blitz entre amigos e bilhete
        run: node testes/testar-adversario-automatico.mjs
      - name: Registros do simulador e do site (se algo falhou)
        if: failure()
        run: tail -n 100 wrangler.log vite.log
